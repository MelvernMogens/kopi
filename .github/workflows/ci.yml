name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    # macOS runners aren't available for private repos on a free plan, so build+test
    # runs locally (swift build && swift test, see HERMES.md). CI guards what CI can.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a secret got committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.pem$|credentials'; then
            echo "::error::A secret or local database file is tracked in git"
            exit 1
          fi
          echo "no secrets tracked"
